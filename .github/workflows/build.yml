# -----------------------------------------------------------------------------
# Ogham for VCV Rack — build and test on all four platforms
#
# SPDX-FileCopyrightText: 2026 Steven Collins <https://keeos.io>
# SPDX-License-Identifier: MIT
# -----------------------------------------------------------------------------
#
# The two macOS targets are the reason this exists. Apple's SDK cannot be
# redistributed and can only be extracted on a Mac, so a Windows workstation
# cannot cross-compile for macOS at all — but GitHub's runners ARE Macs, with
# Xcode already on them, free for public repositories. macos-13 is x64 and
# macos-14 is arm64, and both simply compile the plugin natively.
#
# The Linux job here builds against the runner's own glibc, which is far newer
# than Rack users' distributions. It proves the code compiles and the tests pass;
# release binaries come from the pinned toolchain image, which builds against an
# Ubuntu 16.04 sysroot. See docs/cross-compiling.md.
# -----------------------------------------------------------------------------

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  RACK_SDK_VERSION: 2.6.6

jobs:
  # The parity, converter and multi-instance tests. These are the ones that say
  # the port still sounds like the module, so they run before anything is built
  # for distribution.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the vendored firmware is untouched
        run: python tools/upstream_check.py
      - name: Build and run
        run: make -f tools/host.mk tests
      - name: Compile with clang as well
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang
          make -f tools/host.mk check

      # The same invocation tools/cross_build.py analyze runs locally. Exhaustive
      # rather than cppcheck's normal level, which otherwise reports the branches
      # it skipped as an informational finding and fails on it.
      - name: Static analysis
        run: |
          sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck src/ --std=c++11 -j$(nproc) --check-level=exhaustive --error-exitcode=1 --enable=warning,performance,portability --suppress=missingInclude --inline-suppr

  plugin:
    name: ${{ matrix.name }}
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lin-x64,   os: ubuntu-latest,  sdk: lin-x64 }
          - { name: mac-arm64, os: macos-14,       sdk: mac-arm64 }
          - { name: win-x64,   os: windows-latest, sdk: win-x64 }
          # mac-x64 is deliberately absent. It needs a macos-13 runner — Intel
          # hardware Apple no longer sells and GitHub is winding down — so the
          # pool is small and the job sat queued for over twenty minutes while
          # every other target finished, holding the run's logs hostage with it.
          #
          # Nothing is lost by leaving it out. The VCV Library builds mac-x64
          # itself from source, whatever this workflow does; the local toolchain
          # cross-compiles it here in about four seconds; and the binary it
          # produces has been verified as genuine Mach-O X86_64, ad-hoc signed,
          # targeting macOS 10.9. mac-arm64 still runs on a real Mac here, which
          # is what catches anything Apple's clang would object to.
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd unzip rsync

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          # jq is not optional and not obvious: Rack's plugin.mk shells out to it
          # to read the slug and version out of plugin.json, and without it the
          # build dies at "SLUG could not be found in manifest" — which reads
          # like a broken manifest rather than a missing tool.
          install: >-
            mingw-w64-x86_64-gcc
            make unzip zstd tar coreutils jq

      # Fetched in the shell that will do the build, so RACK_DIR is written in
      # the form that shell understands. Two steps rather than one with an
      # expression in `shell:` — that is not a place expressions are reliably
      # allowed, and it failed the entire workflow at startup, in zero seconds,
      # rather than at the step.
      - name: Fetch the Rack SDK
        if: runner.os != 'Windows'
        run: |
          curl -fL -o rack-sdk.zip \
            "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.sdk }}.zip"
          unzip -q rack-sdk.zip
          echo "RACK_DIR=$PWD/Rack-SDK" >> "$GITHUB_ENV"

      - name: Fetch the Rack SDK (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          curl -fL -o rack-sdk.zip \
            "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.sdk }}.zip"
          unzip -q rack-sdk.zip
          echo "RACK_DIR=$PWD/Rack-SDK" >> "$GITHUB_ENV"

      # clang-analyzer, on the one leg that has the Rack SDK.
      #
      # It catches a class cppcheck does not -- notably pointer arithmetic that
      # walks off the end of one struct member into the next -- and it needs
      # src/Ogham.cpp, which host.mk cannot build because that file requires
      # Rack's headers. So it runs here rather than alongside cppcheck.
      #
      # Three details that are not optional:
      #
      #  - LLVM 21, not the distro's. security.ArrayBound does not exist in
      #    clang-tidy 18, which is what Ubuntu 24.04 ships, and not as an alpha
      #    checker either. With 18 the step passes on code it should reject.
      #  - -fno-gnu-unique is stripped from compile_commands.json. It is a GCC
      #    flag in Rack's own compile.mk; clang rejects it as an unknown
      #    argument and then fails every file with a compiler error rather than
      #    analysing it. -Wsuggest-override goes the same way.
      #  - --warnings-as-errors, so a finding fails the build rather than
      #    scrolling past in a green run.
      #
      # Before Build rather than after: bear has to observe a compilation to
      # record it, so it needs the build that Build would otherwise do. Run
      # here, `make dist` then has an up-to-date plugin and only packages it.
      - name: Static analysis (clang-analyzer)
        if: matrix.name == 'lin-x64'
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh && sudo /tmp/llvm.sh 21
          sudo apt-get install -y --no-install-recommends clang-tidy-21 bear jq
          bear -- make -j$(getconf _NPROCESSORS_ONLN)
          jq 'map(.arguments |= map(select(. != "-fno-gnu-unique" and . != "-Wsuggest-override")))'             compile_commands.json > cc.tmp && mv cc.tmp compile_commands.json
          clang-tidy-21 -p .             --checks='-*,clang-analyzer-*'             --header-filter='^(src|src/shim)/'             --warnings-as-errors='*'             src/*.cpp src/shim/*.cpp

      - name: Build
        if: runner.os != 'Windows'
        run: make -j$(getconf _NPROCESSORS_ONLN) dist

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -j$(nproc) dist

      - uses: actions/upload-artifact@v7
        with:
          name: ogham-${{ matrix.name }}
          path: dist/*.vcvplugin
          if-no-files-found: error

  # Tagged pushes collect the four packages into a draft release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: artifacts/**/*.vcvplugin
