<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ogham for VCV Rack - PLACEHOLDER panel.
  10 HP = 50.8 x 128.5 mm. Phase 4 replaces this with the module's own artwork;
  until then it exists to hold the components layer and give the module a face.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="50.8mm" height="128.5mm" viewBox="0 0 50.8 128.5" version="1.1">
  <g inkscape:groupmode="layer" inkscape:label="panel" id="panel">
    <rect x="0" y="0" width="50.8" height="128.5" fill="#16191b"/>
    <rect x="0.15" y="0.15" width="50.5" height="128.2" fill="none" stroke="#2a3336" stroke-width="0.3"/>

    <text x="25.4" y="11" fill="#b08d3f" font-family="sans-serif" font-size="5.5"
          font-weight="600" text-anchor="middle" letter-spacing="0.6">OGHAM</text>
    <text x="25.4" y="15.5" fill="#5c6a6b" font-family="sans-serif" font-size="2.4"
          text-anchor="middle" letter-spacing="0.4">placeholder</text>

    <text x="13.0" y="31.5" fill="#c9d2d0" font-family="sans-serif" font-size="2.6" text-anchor="middle">FUNC 1</text>
    <text x="37.8" y="31.5" fill="#c9d2d0" font-family="sans-serif" font-size="2.6" text-anchor="middle">FUNC 2</text>
    <text x="13.0" y="53.5" fill="#c9d2d0" font-family="sans-serif" font-size="2.6" text-anchor="middle">A</text>
    <text x="37.8" y="53.5" fill="#c9d2d0" font-family="sans-serif" font-size="2.6" text-anchor="middle">B</text>
    <text x="13.0" y="73.5" fill="#c9d2d0" font-family="sans-serif" font-size="2.6" text-anchor="middle">RATE</text>
    <text x="37.8" y="73.5" fill="#c9d2d0" font-family="sans-serif" font-size="2.6" text-anchor="middle">TONE</text>

    <text x="9.0" y="90.5" fill="#c9d2d0" font-family="sans-serif" font-size="2.6" text-anchor="middle">SYNC</text>

    <rect x="2.5" y="103.5" width="29.0" height="14.5" rx="1.2" fill="#245e5a" opacity="0.35"/>
    <text x="9.0" y="107.0" fill="#dfe6e3" font-family="sans-serif" font-size="2.6" text-anchor="middle">OUT 1</text>
    <text x="24.0" y="107.0" fill="#dfe6e3" font-family="sans-serif" font-size="2.6" text-anchor="middle">OUT 2</text>

    <text x="25.4" y="125" fill="#5c6a6b" font-family="sans-serif" font-size="2.6"
          text-anchor="middle" letter-spacing="0.5">keeos</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="components" id="components">
    <circle cx="13.0" cy="24.0" r="4"/>
    <circle cx="37.8" cy="24.0" r="4"/>
    <circle cx="13.0" cy="46.0" r="4"/>
    <circle cx="37.8" cy="46.0" r="4"/>
    <circle cx="13.0" cy="66.0" r="4"/>
    <circle cx="37.8" cy="66.0" r="4"/>
    <circle cx="9.0"  cy="96.0" r="4"/>
    <circle cx="9.0"  cy="112.0" r="4"/>
    <circle cx="24.0" cy="112.0" r="4"/>
  </g>
</svg>
